<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="game-container">
        <header class="header">
            <h1 class="title">Snake</h1>
            <div class="score-board">
                <div class="score-item">
                    <span class="score-label">Счёт</span>
                    <span class="score-value" id="score">0</span>
                </div>
                <div class="score-item">
                    <span class="score-label">Рекорд</span>
                    <span class="score-value" id="highScore">0</span>
                </div>
            </div>
        </header>

        <div class="game-wrapper">
            <canvas id="gameCanvas" width="600" height="600"></canvas>

            <div class="overlay" id="overlay">
                <div class="overlay-content">
                    <h2 id="overlayTitle">Змейка</h2>
                    <p id="overlayText">Управление стрелками или WASD</p>
                    <p id="finalScore" class="final-score" style="display:none;"></p>
                    <button class="btn btn--start" id="startBtn">Начать игру</button>
                </div>
            </div>
        </div>

        <div class="controls">
            <p class="controls__hint">Стрелки / WASD — движение | Pause: Пробел</p>
            <div class="mobile-controls">
                <button class="ctrl-btn" data-dir="up">▲</button>
                <button class="ctrl-btn" data-dir="down">▼</button>
                <button class="ctrl-btn" data-dir="left">◀</button>
                <button class="ctrl-btn" data-dir="right">▶</button>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
