<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты — Мой сайт</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">MySite</a>
            <nav class="nav" id="nav">
                <a href="index.html" class="nav__link">Главная</a>
                <a href="about.html" class="nav__link">О нас</a>
                <a href="services.html" class="nav__link">Услуги</a>
                <a href="contact.html" class="nav__link nav__link--active">Контакты</a>
            </nav>
            <button class="burger" id="burger" aria-label="Меню">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>

    <main>
        <section class="page-hero">
            <div class="container">
                <h1>Контакты</h1>
                <p>Свяжитесь с нами удобным для вас способом</p>
            </div>
        </section>

        <section class="section">
            <div class="container">
                <div class="features__grid" style="max-width: 700px; margin: 0 auto;">
                    <div class="feature-card">
                        <h3>&#128205; Адрес</h3>
                        <p>г. Москва, ул. Примерная, д. 1</p>
                    </div>
                    <div class="feature-card">
                        <h3>&#128222; Телефон</h3>
                        <p>+7 (999) 123-45-67</p>
                    </div>
                    <div class="feature-card">
                        <h3>&#9993;&#xfe0f; Email</h3>
                        <p>info@mysite.ru</p>
                    </div>
                </div>
            </div>
        </section>

        <section class="contact section">
            <div class="container">
                <h2 class="section__title">Напишите нам</h2>
                <form class="form" id="contactForm">
                    <input type="text" class="form__input" placeholder="Ваше имя" required>
                    <input type="email" class="form__input" placeholder="Email" required>
                    <textarea class="form__input form__input--textarea" placeholder="Сообщение" rows="5" required></textarea>
                    <button type="submit" class="btn btn--primary">Отправить</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 MySite. Все права защищены.</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
